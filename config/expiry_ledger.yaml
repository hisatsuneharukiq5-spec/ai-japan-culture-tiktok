    last_verified: 2026-11-15
    check: GET https://api.twitter.com/2/users/me (OAuth1) — 401 on 2026-11-15. Regenerate in X developer portal; check plan tier.

  - id: assemblyai_key
    kind: api_key
    name: ASSEMBLYAI_API_KEY
    used_by: []
