    workflows: []
    expires: null
    status: active
    last_verified: 2026-11-15
    check: GET https://huggingface.co/api/whoami-v2 returns 200.
    note: Thumbnail path removed (FLUX.1-schnell 410). tiktok_icon_generator still calls an old api-inference URL — likely dead.

  - id: openai_key
