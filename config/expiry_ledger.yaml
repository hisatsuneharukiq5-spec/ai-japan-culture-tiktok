  - id: x_api
    kind: api_key
    name: "X_API_KEY / X_API_KEY_SECRET / X_ACCESS_TOKEN / X_ACCESS_TOKEN_SECRET (X_BEARER_TOKEN unused)"
    used_by: [src/x_poster.py]
    workflows: []
