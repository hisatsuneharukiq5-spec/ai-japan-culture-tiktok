# Expiry ledger — every external dependency this pipeline relies on.
# NEVER put key/token VALUES here. Only names, locations and how to check.
#
# Fields
#   id          unique key
#   kind        oauth_token | pat | api_key | session | oauth_client | model | free_tier | quota
#   name        env var / GitHub Secret / file that holds it (name only)
#   used_by     code files
#   workflows   GitHub Actions workflows (empty = local only)
#   expires     YYYY-MM-DD if known, else null
#   status      active | expired | unused | broken   (as of last_verified)
#   last_verified  YYYY-MM-DD
#   check       how to confirm validity / find the expiry when `expires` is null
#   note        free text
#
# scripts/expiry_check.py lists: expired/broken items, items expiring within
# `warn_within_days` (config/watchdog.yaml), and items whose expiry is unknown.

items:
  # ── YouTube OAuth tokens (one per channel) ─────────────────────────────
  - id: yt_token_facts
    kind: oauth_token
    name: "config/youtube_token_facts.json  /  GitHub Secret YT_TOKEN_FACTS"
    used_by: [facts_scheduler.py, facts_brain.py, main.py (facts-growth), src/self_healer.py, scripts/outcome_check.py]
    workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck]
    expires: null
    status: active
    last_verified: 2026-11-16
    check: >
      Run scripts/outcome_check.py (category "auth" = refresh failed).
      Google revokes refresh tokens unused for 6 months, and after 7 days if the
      OAuth consent screen is in "Testing" — check Google Cloud Console >
      APIs & Services > OAuth consent screen > Publishing status.
    note: Re-authenticated 2026-11-16 (old one invalid_grant). Secret YT_TOKEN_FACTS must hold the same JSON.

  - id: yt_token_obscura
    kind: oauth_token
    name: "config/youtube_token_obscura.json  /  GitHub Secret YT_TOKEN_OBSCURA"
    used_by: [src/obscura_pipeline.py, src/obscura_shorts_generator.py, src/self_healer.py, scripts/outcome_check.py]
    workflows: [obscura_daily, facts_healthcheck]
    expires: null
    status: active
    last_verified: 2026-11-15
    check: Same as yt_token_facts (outcome_check.py; consent-screen publishing status).
    note: Refresh succeeded 2026-11-15. Scope youtube.force-ssl was dropped in code — comment posting may need it.

  - id: yt_token_main
    kind: oauth_token
    name: config/youtube_token.json
    used_by: [src/youtube_uploader.py, src/scheduler.py, src/thumbnail_generator.py]
    workflows: []
    expires: null
    status: active
    last_verified: 2026-11-16
    check: Local only. Refresh fails => re-auth (main channel is not run by Actions).
    note: Created 2026-11-16 (AI Japan). Not in outcome_check (no scheduled publishing).

  - id: yt_oauth_client
    kind: oauth_client
    name: "config/youtube_client_secrets.json  /  GitHub Secret YT_CLIENT_SECRETS  (also YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET in .env)"
    used_by: [facts_scheduler.py, src/youtube_uploader.py, src/obscura_pipeline.py, src/obscura_shorts_generator.py]
    workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck, obscura_daily]
    expires: null
    status: active
    last_verified: 2026-11-16
    check: Google Cloud Console > Credentials — client not deleted/disabled; consent screen "In production".
    note: Desktop-app client. Rotating its secret invalidates every token above.

  # ── GitHub ──────────────────────────────────────────────────────────────
  - id: github_pat
    kind: pat
    name: GitHub Secret GH_PAT
    used_by: []
    workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck, obscura_daily]
    expires: null
    status: active
    last_verified: 2026-11-16
    check: >
      GitHub > Settings > Developer settings > Personal access tokens shows "Expires on".
      Any API call made with it returns header github-authentication-token-expiration.
      Needs: Contents RW (checkout+push), Secrets RW (gh secret set), Actions RW (gh workflow run).
    note: >
      Planned rotation (old token was exposed in a terminal session 2026-11-16).
      After rotating, write the new expiry date into `expires`.
      Local git now uses Git Credential Manager (no token in remote URL).

  - id: dotenv_secret
    kind: session
    name: GitHub Secret DOTENV_CONTENTS
    used_by: [all workflows write it to .env]
    workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck, obscura_daily]
    expires: null
    status: active
    last_verified: 2026-11-16
    check: Must be updated whenever a key inside .env is rotated (it is a copy, not a link).
    note: Contains all API keys below for CI.

  # ── API keys (.env names) ───────────────────────────────────────────────
  - id: anthropic_key
    kind: api_key
    name: ANTHROPIC_API_KEY
    used_by: [facts_scheduler.py, src/obscura_pipeline.py, src/obscura_shorts_generator.py, src/script_generator.py, src/short_script_generator.py, src/article_generator.py, src/error_article_generator.py]
    workflows: [facts_daily, obscura_daily]
    expires: null
    status: active
    last_verified: 2026-11-15
    check: console.anthropic.com > Billing (credit balance, auto-reload). A 1-token messages call verifies the key.
    note: Balance exhaustion stops every script generation.

  - id: pexels_key
    kind: api_key
    name: PEXELS_API_KEY
    used_by: [facts_scheduler.py, src/obscura_pipeline.py, src/obscura_shorts_generator.py, src/free_video_generator.py]
    workflows: [facts_daily, obscura_daily]
    expires: null
    status: active
    last_verified: 2026-11-15
    check: Response header X-Ratelimit-Remaining on /videos/search (monthly allowance).
    note: Free tier.

  - id: pixabay_key
    kind: api_key
    name: PIXABAY_API_KEY
    used_by: [facts_scheduler.py, facts_brain.py, src/obscura_pipeline.py, src/obscura_shorts_generator.py]
    workflows: [facts_daily, obscura_daily]
    expires: null
    status: active
    last_verified: 2026-11-15
    check: GET https://pixabay.com/api/videos/?q=test returns 200.
    note: Free tier (rate-limited per minute).

  - id: freesound_key
    kind: api_key
    name: FREESOUND_API_KEY
    used_by: [src/obscura_pipeline.py, src/obscura_shorts_generator.py]
    workflows: [obscura_daily]
    expires: null
