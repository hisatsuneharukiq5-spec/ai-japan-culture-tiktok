    expires: null
    status: unused
    last_verified: 2026-11-15
    check: Not referenced by any code. Candidate for removal from .env / DOTENV_CONTENTS.

  - id: substack_session
    kind: session
    name: config/substack_session.json (cookie substack.sid) + SUBSTACK_PUBLICATION_URL
    used_by: [src/substack_publisher.py, main.py (article, error-log)]
    workflows: []
