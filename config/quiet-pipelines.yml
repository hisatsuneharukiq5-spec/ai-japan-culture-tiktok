    - id: x_api
      kind: api_key
      name: "X_API_KEY / X_API_KEY_SECRET / X_ACCESS_TOKEN / X_ACCESS_TOKEN_SECRET (X_BEARER_TOKEN unused)"
      used_by: [src/x_poster.py]
      workflows: []
      expires: null
      status: broken
      last_verified: 2026-11-15
      check: GET https://api.twitter.com/2/users/me (OAuth1) — 401 on 2026-11-15. Regenerate in X developer portal; check plan tier.

    - id: assemblyai_key
      kind: api_key
      name: ASSEMBLYAI_API_KEY
      used_by: []
      workflows: []
      expires: null
      status: unused
      last_verified: 2026-11-15
