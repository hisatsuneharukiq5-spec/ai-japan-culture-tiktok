      note: >
        Facts and Obscura tokens share ONE OAuth client = one project quota.
        Estimated use per day after dedup-fix (2026-11-17, Facts 3/day):
        Facts 3 x 1,757 = 5,271 + facts_growth 155 + facts_analyze ~12
        + Obscura 3,353 (long 1,652 + short 1,701) + watchdog ~6 = ~8,800 / 10,000.
        competitor_analyzer (API key, YOUTUBE_API_KEY_FACTS) adds up to ~701 if that key
        belongs to the same Cloud project (unverified) -> ~9,500.
        Retries after a failure and new Facts playlists (+51) are not included.
        quota_guard only records Facts calls, so it cannot see Obscura's share.
        History: 5 Facts/day -> 3 (quota-fix, 2026-11-15); duplicate check moved from
        search.list (400 units/upload) to playlistItems.list (5) (dedup-fix, 2026-11-17).

