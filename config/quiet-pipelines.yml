# quiet-pipelines settings for .github/workflows/watchdog.yml
# NEVER put key/token VALUES here: only the NAMES of secrets / env vars.
version: 1

defaults:
  max_age_hours: 36   # abnormal when the newest PUBLIC video is older than this

checks:
  # Facts posts 3x/day (03:07 / 11:07 / 19:07 JST); 36h tolerates GitHub's
  # schedule delays and one or two missed runs.
  - name: facts-wonders
    type: youtube_latest_upload
    auth: oauth
    token_json_env: YT_TOKEN_FACTS          # GitHub Secret (kept fresh by facts_daily.yml)
    expect_channel_name_contains: Facts & Wonders
    workflows: [facts_daily.yml, facts_growth.yml, facts_analyze.yml, facts_healthcheck.yml]

  # Obscura posts once a day (01:13 JST); 36h still allows one missed run.
  - name: obscura-files
    type: youtube_latest_upload
    auth: oauth
    token_json_env: YT_TOKEN_OBSCURA        # GitHub Secret (kept fresh by obscura_daily.yml)
    expect_channel_name_contains: Obscura Files
    workflows: [obscura_daily.yml]

diagnose:
  enabled: true              # key comes from DOTENV_CONTENTS (see watchdog.yml); skipped if absent
  model: claude-sonnet-5-5
  effort: medium
  language: ja
  lookback_hours: 48
  max_log_chars: 60000
  when: new_or_changed       # call Claude only when the problem is new or its state changed

log_scan:                    # failures hidden inside green runs (`|| true`, continue-on-error)
  enabled: true
  workflows: []              # empty = the workflows listed on the checks above
  lookback_hours: 24
  max_runs: 10
  extra_patterns: []
  ignore: []

issues:
  enabled: true
  label: quiet-pipelines
  repeat_comment_hours: 24
  assignees: []

# Expiry ledger: every external dependency the pipelines rely on.
# Moved here from config/expiry_ledger.yaml (branch watchdog-v1).
# Fields: id, kind, name, used_by, workflows, expires (YYYY-MM-DD|null),
#         status (active|expired|unused|broken), last_verified, check, note
ledger:
  warn_within_days: 30
  stale_after_days: 30
  items:
    # ── YouTube OAuth tokens (one per channel) ─────────────────────────────
    - id: yt_token_facts
      kind: oauth_token
      name: "config/youtube_token_facts.json  /  GitHub Secret YT_TOKEN_FACTS"
      used_by: [facts_scheduler.py, facts_brain.py, main.py (facts-growth), src/self_healer.py, quiet-pipelines (watchdog.yml)]
      workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck]
      expires: null
      status: active
      last_verified: 2026-11-16
      check: >
        The watchdog check (facts-wonders / obscura-files) reports category "auth" when the refresh fails.
        Google revokes refresh tokens unused for 6 months, and after 7 days if the
        OAuth consent screen is in "Testing" — check Google Cloud Console >
        APIs & Services > OAuth consent screen > Publishing status.
      note: Re-authenticated 2026-11-16 (old one invalid_grant). Secret YT_TOKEN_FACTS must hold the same JSON.

    - id: yt_token_obscura
      kind: oauth_token
      name: "config/youtube_token_obscura.json  /  GitHub Secret YT_TOKEN_OBSCURA"
      used_by: [src/obscura_pipeline.py, src/obscura_shorts_generator.py, src/self_healer.py, quiet-pipelines (watchdog.yml)]
      workflows: [obscura_daily, facts_healthcheck]
      expires: null
      status: active
      last_verified: 2026-11-15
      check: Same as yt_token_facts (watchdog check obscura-files; consent-screen publishing status).
      note: Refresh succeeded 2026-11-15. Scope youtube.force-ssl was dropped in code — comment posting may need it.

    - id: yt_token_main
      kind: oauth_token
      name: config/youtube_token.json
      used_by: [src/youtube_uploader.py, src/scheduler.py, src/thumbnail_generator.py]
      workflows: []
      expires: null
      status: active
      last_verified: 2026-11-16
      check: Local only. Refresh fails => re-auth (main channel is not run by Actions).
      note: Created 2026-11-16 (AI Japan). Not watched by the watchdog (no scheduled publishing).

    - id: yt_oauth_client
      kind: oauth_client
      name: "config/youtube_client_secrets.json  /  GitHub Secret YT_CLIENT_SECRETS  (also YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET in .env)"
      used_by: [facts_scheduler.py, src/youtube_uploader.py, src/obscura_pipeline.py, src/obscura_shorts_generator.py]
      workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck, obscura_daily]
      expires: null
      status: active
      last_verified: 2026-11-16
      check: Google Cloud Console > Credentials — client not deleted/disabled; consent screen "In production".
      note: Desktop-app client. Rotating its secret invalidates every token above.

    # ── GitHub ──────────────────────────────────────────────────────────────
    - id: github_pat
      kind: pat
      name: GitHub Secret GH_PAT (fine-grained, no expiration)
      used_by: []
      workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck, obscura_daily]
      expires: null   # fine-grained token created without an expiration date
      status: active
      last_verified: 2026-11-17
      check: >
        GitHub > Settings > Developer settings > Personal access tokens > Fine-grained tokens:
        still listed, "No expiration", not revoked. A failed `git push` / `gh secret set`
        in facts_daily / obscura_daily is the first sign it stopped working.
        Needs: Contents RW (checkout+push), Secrets RW (gh secret set), Actions RW (gh workflow run).
      note: >
        Rotated 2026-11-15 (Secret updated 16:49 UTC; pushes work since 17:01 UTC).
        No expiry means it never warns by date: re-check it here at least every 30 days
        (stale_after_days). The watchdog itself does NOT use it (built-in GITHUB_TOKEN only).
        If an organization policy later forces a maximum lifetime, put the date in `expires`.

    - id: dotenv_secret
      kind: session
      name: GitHub Secret DOTENV_CONTENTS
      used_by: [all workflows write it to .env]
      workflows: [facts_daily, facts_analyze, facts_growth, facts_healthcheck, obscura_daily]
      expires: null
      status: active
      last_verified: 2026-11-16
      check: Must be updated whenever a key inside .env is rotated (it is a copy, not a link).
      note: Contains all API keys below for CI.

    # ── API keys (.env names) ───────────────────────────────────────────────
    - id: anthropic_key
      kind: api_key
      name: ANTHROPIC_API_KEY
      used_by: [facts_scheduler.py, src/obscura_pipeline.py, src/obscura_shorts_generator.py, src/script_generator.py, src/short_script_generator.py, src/article_generator.py, src/error_article_generator.py]
      workflows: [facts_daily, obscura_daily]
      expires: null
      status: active
      last_verified: 2026-11-15
      check: console.anthropic.com > Billing (credit balance, auto-reload). A 1-token messages call verifies the key.
      note: Balance exhaustion stops every script generation.

    - id: pexels_key
      kind: api_key
      name: PEXELS_API_KEY
