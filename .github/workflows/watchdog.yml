name: Watchdog — quiet-pipelines

# Once a day: are Facts and Obscura actually publishing? Is anything in the
# expiry ledger expired or about to expire? Did a "green" run hide a failure?
# Abnormal -> opens / updates a GitHub Issue (label: quiet-pipelines); back to
# normal -> closes it. Failed-run logs are diagnosed by Claude when the
# repository secret ANTHROPIC_API_KEY is set (skipped otherwise).
# Settings: config/quiet-pipelines.yml (no secrets in it).
#
# Uses only the built-in GITHUB_TOKEN (no GH_PAT): it never pushes or
# changes secrets. YouTube cost: ~3 quota units per channel per run.

on:
  schedule:
    - cron: "23 23 * * *"   # 08:23 JST, daily (avoids :00, when GitHub delays scheduled runs most)
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: no Issues, no Claude calls"
        type: boolean
        default: false

permissions:
  contents: read   # checkout + read the config
  actions: read    # read run logs for the diagnosis and the hidden-failure scan
  issues: write    # open / comment / close Issues

# No workflow-level concurrency: a run stuck before it is queued must not
# hold the next one behind it. Runs are read-only apart from Issues, and the
# Issue sync is idempotent (one Issue per problem, found by a hidden key).

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Only says WHETHER the secret is set (a true/false expression); the
      # value itself is never read here.
      - name: Diagnosis key present?
        env:
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_ANTHROPIC_KEY" = "true" ]; then
            echo "Secret ANTHROPIC_API_KEY is set: diagnosis enabled"
          else
            echo "::notice::Secret ANTHROPIC_API_KEY is not set: diagnosis skipped (checks, ledger and Issues still run)"
          fi

      - name: Ensure the Issue label exists
        if: ${{ inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create quiet-pipelines --color FBCA04 --description "Opened by the watchdog (quiet-pipelines)" --force --repo "$GITHUB_REPOSITORY"

      # Published action (public repo hisatsuneharukiq5-spec/quiet-pipelines), pinned to
      # the v0.1.1 tag. Replaces the vendored copy that lived in .github/actions/.
      # To upgrade: bump the tag here; inputs and config/quiet-pipelines.yml stay the same.
      - uses: hisatsuneharukiq5-spec/quiet-pipelines@v0.1.1
        env:
          YT_TOKEN_FACTS: ${{ secrets.YT_TOKEN_FACTS }}
          YT_TOKEN_OBSCURA: ${{ secrets.YT_TOKEN_OBSCURA }}
        with:
          config: config/quiet-pipelines.yml
          github-token: ${{ github.token }}
          # Repository secret, masked by GitHub; passed only to this step.
          # Empty (secret not set) -> diagnosis skipped.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          dry-run: ${{ inputs.dry-run == true }}
