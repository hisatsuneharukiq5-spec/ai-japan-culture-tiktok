name: Facts & Wonders — Daily Auto-Post

on:
  schedule:
    # 5 triggers/day (JST): 03:00, 07:00, 11:00, 15:00, 19:00
    - cron: "0 18 * * *"   # 03:00 JST
    - cron: "0 22 * * *"   # 07:00 JST
    - cron: "0  2 * * *"   # 11:00 JST
    - cron: "0  6 * * *"   # 15:00 JST
    - cron: "0 10 * * *"   # 19:00 JST
  workflow_dispatch:        # manual trigger from GitHub UI

concurrency:
  group: facts-post
  cancel-in-progress: false  # never cancel — always finish the upload

jobs:
  post-facts-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt pytrends

      - name: Restore credentials
        env:
          YT_TOKEN_FACTS:    ${{ secrets.YT_TOKEN_FACTS }}
          YT_CLIENT_SECRETS: ${{ secrets.YT_CLIENT_SECRETS }}
          DOTENV_CONTENTS:   ${{ secrets.DOTENV_CONTENTS }}
        run: |
          mkdir -p config
          printf '%s' "$YT_TOKEN_FACTS"    > config/youtube_token_facts.json
          printf '%s' "$YT_CLIENT_SECRETS" > config/youtube_client_secrets.json
          printf '%s' "$DOTENV_CONTENTS"   > .env

      - name: Post one Facts short
        id: facts_run
        run: python main.py facts-run-single
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      # Auto-retry once on failure (handles transient network / Pexels errors)
      - name: Retry Facts short on failure
        if: failure() && steps.facts_run.outcome == 'failure'
        run: |
          echo "First attempt failed — retrying after 60s..."
          sleep 60
          python main.py facts-run-single
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      # Commit the registry entry created during this run so facts-analyze can read it
      - name: Commit registry update
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add output/analytics/ analysis/ || true
          git diff --cached --quiet || git commit -m "ci: facts registry update [skip ci]"
          git push || true

      # Always rotate token — even on failure the token may have been refreshed
      - name: Rotate token secret if refreshed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f config/youtube_token_facts.json ]; then
            NEW=$(cat config/youtube_token_facts.json)
            echo "$NEW" | gh secret set YT_TOKEN_FACTS --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: facts-error-${{ github.run_id }}
          path: logs/
          retention-days: 5
