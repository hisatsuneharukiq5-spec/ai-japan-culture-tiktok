name: Facts & Wonders — Daily Analysis

on:
  schedule:
    - cron: "30 15 * * *"  # 00:30 JST — runs before first daily upload (03:00 JST)
  workflow_dispatch:        # manual trigger from GitHub UI

concurrency:
  group: facts-analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # needs write access to commit results

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt pytrends

      - name: Restore credentials
        env:
          YT_TOKEN_FACTS:    ${{ secrets.YT_TOKEN_FACTS }}
          YT_CLIENT_SECRETS: ${{ secrets.YT_CLIENT_SECRETS }}
          DOTENV_CONTENTS:   ${{ secrets.DOTENV_CONTENTS }}
        run: |
          mkdir -p config
          printf '%s' "$YT_TOKEN_FACTS"    > config/youtube_token_facts.json
          printf '%s' "$YT_CLIENT_SECRETS" > config/youtube_client_secrets.json
          printf '%s' "$DOTENV_CONTENTS"   > .env

      - name: Run daily analysis
        run: python main.py facts-analyze
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Commit analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config_facts.py output/analytics/ analysis/ || true
          git diff --cached --quiet || git commit -m "ci: facts daily analysis [skip ci]"
          git push || true

      - name: Rotate token if refreshed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f config/youtube_token_facts.json ]; then
            NEW=$(cat config/youtube_token_facts.json)
            echo "$NEW" | gh secret set YT_TOKEN_FACTS --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-error-${{ github.run_id }}
          path: logs/
          retention-days: 5
