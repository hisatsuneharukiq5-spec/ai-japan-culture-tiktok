[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-pipelines"
version = "0.1.0"
description = "Catch pipelines that keep running but stop producing — and the keys that are about to expire."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8,<3",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quiet-pipelines = "quiet_pipelines.cli:main"

[tool.setuptools.packages.find]
include = ["quiet_pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
